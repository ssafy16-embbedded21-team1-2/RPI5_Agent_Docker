[project]
name = "rpi5-agent"
version = "0.1.0"
description = "Raspberry Pi 5 local diagnostic agent starter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "openai>=2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpi5_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
